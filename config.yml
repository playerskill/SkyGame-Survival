# ==========================================
#  SkyGame-Control — универсальный плагин для
#  выполнения разных задач и управления
#  игровыми механиками на сервере RPG-Выживания.
#
# Разделен на модули. У каждого модуля своя
# задача.
# ==========================================

# Модуль 1: фикс бага MC-849.
#
# МС-849: при резком переходе от поедания яблока к
# атаке в бою, сервер доедает яблоко за игрока, хоть
# на клиенте того было отменено поедание. Это сильно
# мешает в дуэлях. Также относится к зельям.
#
# Вторая часть этого бага - поедание предмета (чаще
# всего во второй руке) при нажатии на НПС.
#
# Не даёт серверу «доедать» еду и допивать зелья,
# которые клиент уже отменил (удар или клик по НПС).
eat-fix:
  # Включён ли модуль целиком
  enabled: true
  # Сброс еды/зелья при ударе (замах любой рукой)
  block-on-attack: true
  # Сброс еды/зелья при клике по НПС и другим сущностям
  block-on-npc-click: true

# ------------------------------------------
# Перевод сообщений плагина.
# ------------------------------------------
messages:
  prefix: "&8[&bSkyGame-Control&8] &r"
  reloaded: "&aКонфигурация перезагружена. Активных модулей: &f{count}"
  no-permission: "&cНедостаточно прав."
  usage: "&cИспользование: /control reload"
