# Общие сообщения. Цвета Minecraft: символ § заменён на &.
messages:
  no-permission: "&cУ вас нет прав на эту команду."
  usage: "&eИспользование: /control reload"
  reload-success: "&aКонфигурация перечитана. Активных модулей: &f{active}"
  reload-error: "&cНе удалось перечитать конфигурацию. Подробности в консоли."
  module-enabled: "&aМодуль {module} включён."
  module-disabled: "&eМодуль {module} выключен."
  module-error: "&cОшибка модуля {module}. Подробности в консоли."

modules:
  # Защита от потери еды/зелий при атаке или клике по сущности.
  mc-849:
    enabled: true

    # Прерывать потребление после удара игрока.
    block-on-attack: true

    # Прерывать потребление после взаимодействия с сущностью/НПС.
    block-on-entity-click: true

    # Время, в течение которого событие атаки/клика считается связанным
    # с отменённым клиентом потреблением. Значение в миллисекундах.
    detection-window-ms: 250
