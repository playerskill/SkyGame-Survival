database:
  type: mysql              # mysql | mariadb
  address: 127.0.0.1:3306
  name: base_name
  username: ""
  password: ""

checks:
  check-interval-seconds: 30          # период фоновой проверки при нормальной работе
  outage-check-interval-seconds: 10   # период проверки во время сбоя и окна восстановления
  kick-after-seconds: 300             # через сколько секунд сбоя кикать всех и включать вайтлист
  recovery-confirm-seconds: 120       # сколько база должна быть доступна подряд, чтобы снять вайтлист (0 — снимать сразу)

whitelist:
  bypass-players:            # игроки, которым вайтлист выдаётся принудительно при сбое
    - "PlayeR_SkiLL"

messages:
  prefix: ""
  kick: "&cОшибка базы данных, срочно сообщите об этом в группе тг - t.me/skygame001"
  whitelist-on: |
    &c&l[Сервер] ВНИМАНИЕ!
    &cОбнаружен сбой базы данных.
    &7Вход ограничен, операции с валютой приостановлены.
    &7Мы уже знаем о проблеме и чиним.
  whitelist-off: "&a[Сервер] База данных восстановлена. Вход открыт."
  join-blocked: "&cСервер временно закрыт: сбой базы данных. Попробуйте позже."
  economy-blocked: "&cОперации с валютой временно недоступны: сбой базы данных."
