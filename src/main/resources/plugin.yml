name: SkyDbWatchdog
main: ru.playerskill.skydbwatchdog.SkyDbWatchdog
version: 1.0.0
author: PlayeR_SkiLL
description: Плагин для выбрасывания игроков с сервера в рамках предотвращения сбоев экономики

commands:
  skydb:
    description: Управление SkyDbWatchdog
    usage: /skydb test
    aliases: [dbwatchdog]

permissions:
  skydb.admin:
    description: Доступ к командам SkyDbWatchdog
    default: op
